{% extends 'myblog/base.html' %}

{% block title %}Контакты. Блог о цветах{% endblock %}

{% block content %}
<section class="my-carousel">
  <div id="carouselExampleCaptions" class="carousel slide" data-ride="carousel">
    <div class="carousel-inner">
      <div class="carousel-item active" style="background-color: #343a40!important">
        <div class="carousel-caption d-none d-md-block">
          <h1>Написать мне</h1>
        </div>
      </div>
    </div>
  </div>
</section>

<section class="my-contact-form">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12">
        <nav aria-label="breadcrumb" class="my-4">
          <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="{% url 'home' %}">Главная</a></li>
            <li class="breadcrumb-item active" aria-current="page">Форма обратной связи</li>
          </ol>
        </nav>

        <div class="row justify-content-center">
          <div class="col-6">
            <p class="lead">Чтобы связаться со мной заполните форму обратной связи</p>

            <form method="post">
              {% csrf_token %}
              <div class="row">
                <div class="col-md-6">
                  <div class="md-form mb-0">
                    <input type="text" name="name" class="form-control" placeholder="Ваше имя" required>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="md-form mb-0">
                    <input type="email" name="email" class="form-control" placeholder="Ваша почта" required>
                  </div>
                </div>
              </div>

              <div class="row mt-3">
                <div class="col-md-12">
                  <div class="md-form mb-0">
                    <input type="text" name="subject" class="form-control" placeholder="Тема">
                  </div>
                </div>
              </div>

              <div class="row mt-3">
                <div class="col-md-12">
                  <div class="md-form">
                    <textarea name="message" rows="2" class="form-control md-textarea" placeholder="Ваше сообщение" required></textarea>
                  </div>
                </div>
              </div>

              <div class="text-center text-md-start my-3">
                <button class="btn btn-pink" type="submit">Отправить</button>
              </div>
            </form>

          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
